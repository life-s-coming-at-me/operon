name: release
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with BRAT assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes "Unofficial private performance test build. Unofficial, not endorsed by the Operon maintainer. Source: perf/* branches of this fork."
